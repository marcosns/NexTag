<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel NexTag</title>

<link rel="icon" href="favicon.ico">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial;
  background:url('fundo6.jpg') center/cover no-repeat fixed;
  color:#fff;
}

/* topo */
.topo{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#000000aa;
}

/* container */
.container{
  padding:20px;
}

/* arquivos */
.file{
  display:flex;
  justify-content:space-between;
  background:#00000088;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
}

.actions button{
  margin-left:5px;
  cursor:pointer;
}

/* modal */
#modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#fff;
  color:#000;
  padding:20px;
  border-radius:10px;
  width:300px;
}

.icon-picker i{
  cursor:pointer;
  margin:5px;
  font-size:20px;
}

.icon-picker .selected{
  color:red;
}
</style>
</head>

<body>

<!-- TOPO -->
<div class="topo">
  <div>
    <button onclick="abrirHistorico()">📜 Histórico</button>
  </div>

  <div>
    👤 <span id="userNome">Usuário</span>
    <button onclick="logout()">❌</button>
  </div>
</div>

<!-- CONTEUDO -->
<div class="container">

  <!-- PROJETO -->
  <select id="projetoSelect" onchange="selecionarProjeto()">
    <option value="">Selecione o projeto</option>
  </select>

  <br><br>

  <!-- AÇÕES -->
  <button onclick="abrirModal()">➕ Adicionar</button>

  <select id="ordem" onchange="ordenar()">
    <option value="az">A-Z</option>
    <option value="za">Z-A</option>
  </select>

  <br><br>

  <!-- LISTA -->
  <div id="listaArquivos"></div>

</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">

    <h3>Arquivo</h3>

    <input id="nomeArquivo" placeholder="Nome" style="width:100%"><br><br>
    <input id="fileLink" placeholder="Link" style="width:100%"><br><br>

    <p>Selecione o ícone:</p>

    <div class="icon-picker">
      <i class="fas fa-file" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-file-pdf" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-image" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-folder" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-shield-halved" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-address-book" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-book" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-calendar" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-compass-drafting" onclick="selecionarIcone(this)"></i>
    </div>

    <br>

    <button onclick="salvar()">💾 Salvar</button>
    <button onclick="fecharModal()">❌</button>

  </div>
</div>

<!-- SCRIPT -->
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let arquivos = [];
let projetoAtual = null;
let iconeSelecionado = "fas fa-file";
let editandoNome = null;

document.addEventListener("DOMContentLoaded", () => {
  const userData = JSON.parse(localStorage.getItem("userData") || "{}");
  document.getElementById("userNome").innerText = userData.usuario || "Usuário";
  carregarProjetos();
});

function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb;
  document.body.appendChild(script);
}

function carregarProjetos(){
  const select = document.getElementById("projetoSelect");

  chamarAPI({action:"getProjetos"}, res=>{
    select.innerHTML = "<option value=''>Selecione</option>";

    (res.projetos || []).forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.id_projeto;
      opt.textContent = p.nome;
      select.appendChild(opt);
    });
  });
}

function selecionarProjeto(){
  projetoAtual = document.getElementById("projetoSelect").value;
  if(!projetoAtual) return;

  chamarAPI({action:"getArquivos", projeto:projetoAtual}, res=>{
    arquivos = res.arquivos || [];
    ordenar();
  });
}

function render(){
  const lista = document.getElementById("listaArquivos");
  lista.innerHTML="";

  arquivos.forEach(a=>{
    lista.innerHTML += `
      <div class="file">
        <div><i class="${a.icone}"></i> ${a.nome}</div>
        <div class="actions">
          <button onclick="window.open('${a.link}')">👁️</button>
          <button onclick="editar('${a.nome}','${a.link}','${a.icone}')">✏️</button>
          <button onclick="excluir('${a.nome}')">🗑️</button>
        </div>
      </div>
    `;
  });
}

function ordenar(){
  const tipo = document.getElementById("ordem").value;

  arquivos.sort((a,b)=>{
    if(tipo==="az") return a.nome.localeCompare(b.nome);
    if(tipo==="za") return b.nome.localeCompare(a.nome);
    return 0;
  });

  render();
}

function abrirModal(){
  document.getElementById("modal").style.display="flex";
  nomeArquivo.value="";
  fileLink.value="";
  editandoNome=null;
}

function editar(nome,link,icone){
  document.getElementById("modal").style.display="flex";
  nomeArquivo.value=nome;
  fileLink.value=link;
  iconeSelecionado=icone;
  editandoNome=nome;
}

function salvar(){
  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value,
    icone:iconeSelecionado,
    antigo:editandoNome
  }, ()=>{
    fecharModal();
    selecionarProjeto();
  });
}

function excluir(nome){
  if(confirm("Excluir?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome
    }, selecionarProjeto);
  }
}

function selecionarIcone(el){
  document.querySelectorAll(".icon-picker i").forEach(i=>i.classList.remove("selected"));
  el.classList.add("selected");
  iconeSelecionado = el.className;
}

function fecharModal(){
  document.getElementById("modal").style.display="none";
}

function abrirHistorico(){
  alert("Histórico em breve versão premium 😉");
}

function logout(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
