<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel NexTag</title>

<!-- SEUS ARQUIVOS -->
<link rel="icon" href="favicon.ico">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
  --primary: #4da3ff;
}

/* BODY */
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: url('fundo6.jpg') center/cover no-repeat fixed;
  color:#fff;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:rgba(0,0,0,0.6);
  backdrop-filter: blur(12px);
  border-bottom:1px solid var(--border);
}

.logo img{
  height:40px;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:14px;
}

.logout{
  cursor:pointer;
  color:#ff5c5c;
  font-size:18px;
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:30px auto;
  padding:25px;
  border-radius:14px;
  background:var(--glass);
  backdrop-filter: blur(18px);
  border:1px solid var(--border);
}

/* TITULO */
.title{
  margin:10px 0 20px;
  font-size:20px;
  opacity:0.9;
}

/* CONTROLES */
.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

/* BOTÕES */
button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:rgba(255,255,255,0.1);
  color:#fff;
  transition:0.2s;
}

button:hover{
  background:var(--primary);
}

/* SELECT */
select, input{
  padding:8px;
  border-radius:6px;
  border:none;
}

/* TABELA */
table{
  width:100%;
  border-collapse: collapse;
}

td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.actions button{
  margin-right:5px;
}

/* LOGO CLIENTE */
#logoProjeto{
  max-height:60px;
  margin-bottom:10px;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#1e1e1e;
  padding:25px;
  border-radius:10px;
  width:320px;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="nextag_logo.png">
  </div>

  <div class="user">
    <span id="nomeUsuario"></span>
    <i class="fas fa-times logout" onclick="logout()"></i>
  </div>
</div>

<!-- CONTEUDO -->
<div class="container">

  <div class="controls">
    <button onclick="abrirHistorico()">📜 Histórico</button>

    <div>
      <select id="ordenar" onchange="ordenarArquivos()">
        <option value="nome">A-Z</option>
        <option value="data">Data</option>
      </select>

      <button onclick="abrirModal()">+ Arquivo</button>
    </div>
  </div>

  <img id="logoProjeto">

  <h3 class="title">
    Bem-vindo ao portal de Administração do NexTag
  </h3>

  <select id="projetoSelect" onchange="selecionarProjeto()"></select>

  <table>
    <tbody id="listaArquivos"></tbody>
  </table>

</div>

<!-- FOOTER -->
<div class="footer">
  Suporte: contato@nextag.com.br | © NexTag
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Novo Arquivo</h3><br>

    <input id="nomeArquivo" placeholder="Nome"><br><br>
    <input id="fileLink" placeholder="Link"><br><br>

    <select id="icone">
      <option value="fas fa-file">Arquivo</option>
      <option value="fas fa-image">Imagem</option>
      <option value="fas fa-file-pdf">PDF</option>
    </select><br><br>

    <button onclick="salvar()">Salvar</button>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>

<!-- SCRIPT -->
<script>
const API_URL = "SUA_API_AQUI";

let projetoAtual=null;
let arquivos=[];

window.onload=()=>{
  const user=JSON.parse(localStorage.getItem("userData")||"{}");
  document.getElementById("nomeUsuario").innerText =
    user.usuario || "Administrador";

  carregarProjetos();
};

function chamarAPI(params,callback){
  const cb="cb_"+Date.now();
  const script=document.createElement("script");

  window[cb]=function(data){
    callback(data);
    delete window[cb];
    script.remove();
  }

  script.src=API_URL+"?"+new URLSearchParams(params)+"&callback="+cb;
  document.body.appendChild(script);
}

function logout(){
  localStorage.clear();
  location.reload();
}

function carregarProjetos(){
  chamarAPI({action:"getProjetos"},res=>{
    const sel=document.getElementById("projetoSelect");

    res.projetos.forEach(p=>{
      const o=document.createElement("option");
      o.value=p.id_projeto;
      o.textContent=p.nome;
      o.dataset.logo=p.logo;
      sel.appendChild(o);
    });
  });
}

function selecionarProjeto(){
  const sel=document.getElementById("projetoSelect");
  const opt=sel.selectedOptions[0];

  projetoAtual=sel.value;

  document.getElementById("logoProjeto").src=opt.dataset.logo;

  carregarArquivos();
}

function carregarArquivos(){
  chamarAPI({action:"getArquivos",projeto:projetoAtual},res=>{
    arquivos=res.arquivos;
    renderArquivos();
  });
}

function renderArquivos(){
  const lista=document.getElementById("listaArquivos");
  lista.innerHTML="";

  arquivos.forEach(a=>{
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td><i class="${a.icone}"></i> ${a.nome}</td>
      <td class="actions">
        <button onclick="window.open('${a.link}')"><i class="fas fa-eye"></i></button>
        <button onclick="editar('${a.nome}')"><i class="fas fa-edit"></i></button>
        <button onclick="window.open('${a.link}')"><i class="fas fa-download"></i></button>
        <button onclick="excluir('${a.nome}')"><i class="fas fa-trash"></i></button>
      </td>
    `;

    lista.appendChild(tr);
  });
}

function ordenarArquivos(){
  const tipo=document.getElementById("ordenar").value;

  if(tipo==="nome"){
    arquivos.sort((a,b)=>a.nome.localeCompare(b.nome));
  }else{
    arquivos.sort((a,b)=>new Date(b.data)-new Date(a.data));
  }

  renderArquivos();
}

function abrirModal(){modal.style.display="flex";}
function fecharModal(){modal.style.display="none";}

function salvar(){
  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value,
    icone:icone.value
  },()=>{
    fecharModal();
    carregarArquivos();
  });
}

function editar(nome){
  const novoNome=prompt("Novo nome:", nome);
  const novoLink=prompt("Novo link:");

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:novoNome,
    link:novoLink
  },carregarArquivos);
}

function excluir(nome){
  if(confirm("Excluir?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome
    },carregarArquivos);
  }
}

function abrirHistorico(){
  alert("Histórico (podemos evoluir depois)");
}
</script>

</body>
</html>
