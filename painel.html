<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel NexTag</title>

<!-- FAVICON -->
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
}

.logout{
  cursor:pointer;
  color:#ff5c5c;
}

/* CONTAINER */
.container{
  max-width:1000px;
  margin:30px auto;
  padding:20px;
  border-radius:12px;
  background:rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
}

/* TITULO */
.title{
  margin-bottom:20px;
}

/* CONTROLES */
.controls{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

/* BOTÕES */
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#333;
  color:#fff;
}

/* TABELA */
table{
  width:100%;
  border-collapse: collapse;
}

td{
  padding:10px;
  border-bottom:1px solid #444;
}

.actions button{
  margin-right:5px;
}

/* LOGO CLIENTE */
#logoProjeto{
  max-height:70px;
  margin-bottom:10px;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#222;
  padding:20px;
  border-radius:10px;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:15px;
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">🚀 NexTag Admin</div>

  <div class="user">
    <span id="nomeUsuario"></span>
    <i class="fas fa-times logout" onclick="logout()"></i>
  </div>
</div>

<div class="container">

  <div class="controls">
    <button onclick="abrirHistorico()">📜 Histórico</button>

    <div>
      <select id="ordenar" onchange="ordenarArquivos()">
        <option value="nome">A-Z</option>
        <option value="data">Data</option>
      </select>

      <button onclick="abrirModal()">+ Arquivo</button>
    </div>
  </div>

  <img id="logoProjeto">

  <h3 class="title">
    Bem vindo ao portal de Administração do NexTag
  </h3>

  <select id="projetoSelect" onchange="selecionarProjeto()"></select>

  <table>
    <tbody id="listaArquivos"></tbody>
  </table>

</div>

<div class="footer">
  Suporte: contato@nextag.com | © NexTag
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <input id="nomeArquivo" placeholder="Nome"><br><br>
    <input id="fileLink" placeholder="Link"><br><br>

    <select id="icone">
      <option value="fas fa-file">Arquivo</option>
      <option value="fas fa-image">Imagem</option>
      <option value="fas fa-file-pdf">PDF</option>
    </select><br><br>

    <button onclick="salvar()">Salvar</button>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>

<!-- SCRIPT -->
<script>
const API_URL = "SUA_API_AQUI";

let projetoAtual=null;
let arquivos=[];

/* API */
function chamarAPI(params,callback){
  const cb="cb_"+Date.now();
  const script=document.createElement("script");

  window[cb]=function(data){
    callback(data);
    delete window[cb];
    script.remove();
  }

  script.src=API_URL+"?"+new URLSearchParams(params)+"&callback="+cb;
  document.body.appendChild(script);
}

/* LOGIN SIMPLES */
window.onload=()=>{
  const user=JSON.parse(localStorage.getItem("userData")||"{}");

  document.getElementById("nomeUsuario").innerText =
    user.usuario || "Admin";

  carregarProjetos();
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}

/* PROJETOS */
function carregarProjetos(){
  chamarAPI({action:"getProjetos"},res=>{
    const sel=document.getElementById("projetoSelect");

    res.projetos.forEach(p=>{
      const o=document.createElement("option");
      o.value=p.id_projeto;
      o.textContent=p.nome;
      o.dataset.logo=p.logo;
      sel.appendChild(o);
    });
  });
}

/* SELEÇÃO */
function selecionarProjeto(){
  const sel=document.getElementById("projetoSelect");
  const opt=sel.selectedOptions[0];

  projetoAtual=sel.value;

  document.getElementById("logoProjeto").src=opt.dataset.logo;

  carregarArquivos();
}

/* ARQUIVOS */
function carregarArquivos(){
  chamarAPI({action:"getArquivos",projeto:projetoAtual},res=>{
    arquivos=res.arquivos;
    renderArquivos();
  });
}

function renderArquivos(){
  const lista=document.getElementById("listaArquivos");
  lista.innerHTML="";

  arquivos.forEach(a=>{
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td><i class="${a.icone}"></i> ${a.nome}</td>
      <td class="actions">
        <button onclick="window.open('${a.link}')">👁️</button>
        <button onclick="editar('${a.nome}')">✏️</button>
        <button onclick="window.open('${a.link}')">⬇️</button>
        <button onclick="excluir('${a.nome}')">🗑️</button>
      </td>
    `;

    lista.appendChild(tr);
  });
}

/* ORDENAR */
function ordenarArquivos(){
  const tipo=document.getElementById("ordenar").value;

  if(tipo==="nome"){
    arquivos.sort((a,b)=>a.nome.localeCompare(b.nome));
  }else{
    arquivos.sort((a,b)=>new Date(b.data)-new Date(a.data));
  }

  renderArquivos();
}

/* MODAL */
function abrirModal(){modal.style.display="flex";}
function fecharModal(){modal.style.display="none";}

/* SALVAR */
function salvar(){
  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value,
    icone:icone.value
  },()=>{
    fecharModal();
    carregarArquivos();
  });
}

/* EDITAR */
function editar(nome){
  const novoNome=prompt("Novo nome:");
  const novoLink=prompt("Novo link:");

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:novoNome,
    link:novoLink
  },carregarArquivos);
}

/* EXCLUIR */
function excluir(nome){
  if(confirm("Excluir?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome
    },carregarArquivos);
  }
}

/* HISTORICO */
function abrirHistorico(){
  alert("Histórico aqui (pode evoluir depois)");
}
</script>

</body>
</html>
