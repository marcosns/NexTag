<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>NexTag Admin</title>

<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:url("fundo6.jpg") center/cover no-repeat fixed;
  color:#fff;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{ height:40px; }

.top-actions{
  display:flex;
  gap:15px;
  align-items:center;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:70px;
  width:220px;
  bottom:0;
  background:rgba(0,0,0,0.6);
  padding:20px;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
}

/* CARDS */
.card{
  background:rgba(0,0,0,0.5);
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

/* LISTA */
.file{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.file i{ margin-right:10px; }

.actions button{
  margin-left:5px;
  background:#222;
  border:none;
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.actions button:hover{ background:#555; }

/* ICON PICKER */
.icon-picker i{
  font-size:22px;
  margin:8px;
  cursor:pointer;
}

.icon-picker i.selected{
  color:#00d4ff;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:350px;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:15px;
  background:rgba(0,0,0,0.7);
  position:fixed;
  bottom:0;
  width:100%;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="nextag_logo.png">
    <div>Admin NexTag</div>
  </div>

  <div class="top-actions">
    <span id="userNome"></span>
    <button onclick="toggleTema()">🌙</button>
    <button onclick="logout()">✖</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <button onclick="abrirHistorico()">📜 Histórico</button>
  <hr>
  <select id="ordem" onchange="ordenar()">
    <option value="az">A-Z</option>
    <option value="za">Z-A</option>
  </select>
</div>

<!-- MAIN -->
<div class="main">

<div class="card">
<h2>Bem vindo ao portal NexTag</h2>
<p>Gerencie arquivos e projetos com facilidade.</p>

<select id="projetoSelect" onchange="selecionarProjeto()"></select>
</div>

<div class="card" id="listaArquivos"></div>

</div>

<!-- MODAL EDIT -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Editar Arquivo</h3>

    <input id="nomeArquivo" placeholder="Nome"><br><br>
    <input id="fileLink" placeholder="Link"><br><br>

    <p>Selecione o ícone:</p>
    <div class="icon-picker">
      <i class="fas fa-file" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-file-pdf" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-image" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-folder" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-shield-halved" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-address-book" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-book" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-calendar" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-compass-drafting" onclick="selecionarIcone(this)"></i>
    </div>

    <br>
    <button onclick="salvar()">Salvar</button>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
Suporte: contato@nextag.com.br
</div>

<script>
let arquivos = [];
let projetoAtual = null;
let iconeSelecionado = "fas fa-file";

function selecionarIcone(el){
  document.querySelectorAll(".icon-picker i").forEach(i=>i.classList.remove("selected"));
  el.classList.add("selected");
  iconeSelecionado = el.className;
}

function selecionarProjeto(){
  projetoAtual = document.getElementById("projetoSelect").value;
  carregarArquivos();
}

function carregarArquivos(){
  chamarAPI({action:"getArquivos", projeto:projetoAtual}, res=>{
    arquivos = res.arquivos;
    render();
  });
}

function render(){
  const lista = document.getElementById("listaArquivos");
  lista.innerHTML="";

  arquivos.forEach(a=>{
    lista.innerHTML += `
      <div class="file">
        <div><i class="${a.icone}"></i> ${a.nome}</div>
        <div class="actions">
          <button onclick="window.open('${a.link}')">👁</button>
          <button onclick="editar('${a.nome}','${a.link}','${a.icone}')">✏</button>
          <button onclick="excluir('${a.nome}')">🗑</button>
        </div>
      </div>`;
  });
}

function ordenar(){
  const tipo = document.getElementById("ordem").value;

  arquivos.sort((a,b)=>{
    if(tipo==="az") return a.nome.localeCompare(b.nome);
    return b.nome.localeCompare(a.nome);
  });

  render();
}

function editar(nome,link,icone){
  document.getElementById("modal").style.display="flex";
  nomeArquivo.value = nome;
  fileLink.value = link;
  iconeSelecionado = icone;
}

function fecharModal(){
  document.getElementById("modal").style.display="none";
}

function toggleTema(){
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
