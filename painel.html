<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let arquivos = [];
let projetoAtual = null;
let iconeSelecionado = "fas fa-file";
let editandoNome = null;

/* API */
function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb;
  document.body.appendChild(script);
}

/* INIT */
window.onload = function(){
  const userData = JSON.parse(localStorage.getItem("userData") || "{}");

  const elUser = document.getElementById("userNome");
  if(elUser){
    elUser.innerText = userData.usuario || "Usuário";
  }

  carregarProjetos();
}

/* PROJETOS */
function carregarProjetos(){
  chamarAPI({action:"getProjetos"}, res=>{

    const select = document.getElementById("projetoSelect");
    if(!select) return;

    select.innerHTML = "<option value=''>Selecione o projeto</option>";

    (res.projetos || []).forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.id_projeto;
      opt.textContent = p.nome;
      select.appendChild(opt);
    });

  });
}

/* SELECIONAR PROJETO */
function selecionarProjeto(){
  const select = document.getElementById("projetoSelect");
  if(!select) return;

  projetoAtual = select.value;
  if(!projetoAtual) return;

  carregarArquivos();
}

/* CARREGAR ARQUIVOS */
function carregarArquivos(){
  chamarAPI({action:"getArquivos", projeto:projetoAtual}, res=>{
    arquivos = res.arquivos || [];
    ordenar(); // 🔥 já aplica ordenação automaticamente
  });
}

/* RENDER */
function render(){
  const lista = document.getElementById("listaArquivos");
  if(!lista) return;

  lista.innerHTML="";

  arquivos.forEach(a=>{
    lista.innerHTML += `
      <div class="file">
        <div>
          <i class="${a.icone}"></i> ${a.nome}
        </div>

        <div class="actions">
          <button onclick="window.open('${a.link}')">👁️</button>
          <button onclick="editar('${a.nome}','${a.link}','${a.icone}')">✏️</button>
          <button onclick="excluir('${a.nome}')">🗑️</button>
        </div>
      </div>
    `;
  });
}

/* ORDENAÇÃO */
function ordenar(){
  const el = document.getElementById("ordem");
  if(!el){
    render();
    return;
  }

  const tipo = el.value;

  arquivos.sort((a,b)=>{
    if(tipo==="az") return a.nome.localeCompare(b.nome);
    if(tipo==="za") return b.nome.localeCompare(a.nome);
    return 0;
  });

  render();
}

/* ABRIR MODAL (NOVO ARQUIVO) */
function abrirModal(){
  const modal = document.getElementById("modal");
  if(!modal) return;

  modal.style.display="flex";

  nomeArquivo.value = "";
  fileLink.value = "";
  iconeSelecionado = "fas fa-file";
  editandoNome = null;

  document.querySelectorAll(".icon-picker i").forEach(i=>{
    i.classList.remove("selected");
  });
}

/* EDITAR */
function editar(nome,link,icone){

  const modal = document.getElementById("modal");
  if(!modal) return;

  modal.style.display="flex";

  nomeArquivo.value = nome;
  fileLink.value = link;

  iconeSelecionado = icone;
  editandoNome = nome;

  document.querySelectorAll(".icon-picker i").forEach(i=>{
    i.classList.remove("selected");
    if(i.className === icone) i.classList.add("selected");
  });
}

/* SALVAR (CRIA OU EDITA) */
function salvar(){

  if(!projetoAtual) return;

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value,
    icone:iconeSelecionado,
    antigo: editandoNome
  }, ()=>{
    fecharModal();
    carregarArquivos();
  });
}

/* EXCLUIR */
function excluir(nome){
  if(confirm("Excluir arquivo?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome
    }, carregarArquivos);
  }
}

/* ICONE */
function selecionarIcone(el){
  document.querySelectorAll(".icon-picker i").forEach(i=>i.classList.remove("selected"));
  el.classList.add("selected");
  iconeSelecionado = el.className;
}

/* FECHAR MODAL */
function fecharModal(){
  const modal = document.getElementById("modal");
  if(modal) modal.style.display="none";
}

/* HISTÓRICO */
function abrirHistorico(){

  if(!projetoAtual){
    alert("Selecione um projeto primeiro");
    return;
  }

  chamarAPI({action:"getHistorico", projeto:projetoAtual}, res=>{

    let texto = "Histórico:\n\n";

    (res.historico || []).forEach(h=>{
      const data = new Date().toLocaleString();
      texto += `${data} - ${h.nome} - ${h.acao}\n`;
    });

    alert(texto);
  });
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}
</script>
