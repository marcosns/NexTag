<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let arquivos = [];
let projetoAtual = null;
let iconeSelecionado = "fas fa-file";
let editandoNome = null;
let projetos = [];

/* INIT */
document.addEventListener("DOMContentLoaded", () => {

  const userData = JSON.parse(localStorage.getItem("userData") || "{}");

  // 🔐 PROTEÇÃO LOGIN
  if(!userData.usuario){
    alert("Sessão expirada. Faça login novamente.");
    window.location.href = "index.html"; // ou login.html
    return;
  }

  // 👤 Nome usuário
  const elUser = document.getElementById("userNome");
  if(elUser){
    elUser.innerText = userData.usuario;
  }

  carregarProjetos();
});

/* API */
function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb;
  document.body.appendChild(script);
}

/* PROJETOS */
function carregarProjetos(){

  const select = document.getElementById("projetoSelect");
  if(!select) return;

  chamarAPI({action:"getProjetos"}, res=>{

    projetos = res.projetos || [];

    select.innerHTML = "<option value=''>Selecione o projeto</option>";

    projetos.forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.id_projeto;
      opt.textContent = p.nome;

      opt.dataset.logo = p.logo || "";

      select.appendChild(opt);
    });

  });
}

/* SELECIONAR PROJETO */
function selecionarProjeto(){

  const select = document.getElementById("projetoSelect");
  if(!select) return;

  projetoAtual = select.value;

  if(!projetoAtual) return;

  const opt = select.selectedOptions[0];

  // 🏷 LOGO CLIENTE
  const logoCliente = document.getElementById("logoCliente");
  if(logoCliente){
    logoCliente.src = opt.dataset.logo || "";
    logoCliente.style.display = opt.dataset.logo ? "block" : "none";
  }

  carregarArquivos();
}

/* CARREGAR ARQUIVOS */
function carregarArquivos(){
  chamarAPI({action:"getArquivos", projeto:projetoAtual}, res=>{
    arquivos = res.arquivos || [];
    ordenar();
  });
}

/* RENDER */
function render(){
  const lista = document.getElementById("listaArquivos");
  if(!lista) return;

  lista.innerHTML="";

  arquivos.forEach(a=>{
    lista.innerHTML += `
      <div class="file">
        <div>
          <i class="${a.icone}"></i> ${a.nome}
        </div>

        <div class="actions">

          <button class="btn" onclick="preview('${a.link}')">
            <i class="fas fa-eye"></i>
          </button>

          <button class="btn" onclick="editar('${a.nome}','${a.link}','${a.icone}')">
            <i class="fas fa-pen"></i>
          </button>

          <button class="btn danger" onclick="excluir('${a.nome}')">
            <i class="fas fa-trash"></i>
          </button>

        </div>
      </div>
    `;
  });
}

/* ORDENAÇÃO */
function ordenar(){
  const el = document.getElementById("ordem");

  if(el){
    const tipo = el.value;

    arquivos.sort((a,b)=>{
      if(tipo==="az") return a.nome.localeCompare(b.nome);
      if(tipo==="za") return b.nome.localeCompare(a.nome);
      return 0;
    });
  }

  render();
}

/* PREVIEW TAG.HTML 🔥 */
function preview(link){

  const modal = document.getElementById("modalPreview");
  const frame = document.getElementById("framePreview");

  if(modal && frame){
    frame.src = link;
    modal.style.display = "flex";
  }
}

function fecharPreview(){
  document.getElementById("modalPreview").style.display="none";
}

/* MODAL */
function abrirModal(){
  document.getElementById("modal").style.display="flex";

  nomeArquivo.value="";
  fileLink.value="";
  editandoNome=null;
}

/* EDITAR */
function editar(nome,link,icone){

  abrirModal();

  nomeArquivo.value = nome;
  fileLink.value = link;

  iconeSelecionado = icone;
  editandoNome = nome;

  document.querySelectorAll(".icon-picker i").forEach(i=>{
    i.classList.remove("selected");
    if(i.className === icone) i.classList.add("selected");
  });
}

/* SALVAR */
function salvar(){

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value,
    icone:iconeSelecionado,
    antigo: editandoNome
  }, ()=>{
    fecharModal();
    carregarArquivos();
  });
}

/* EXCLUIR */
function excluir(nome){
  if(confirm("Excluir arquivo?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome
    }, carregarArquivos);
  }
}

/* ICONE */
function selecionarIcone(el){
  document.querySelectorAll(".icon-picker i").forEach(i=>i.classList.remove("selected"));
  el.classList.add("selected");
  iconeSelecionado = el.className;
}

/* FECHAR MODAL */
function fecharModal(){
  document.getElementById("modal").style.display="none";
}

/* LOGOUT 🔐 */
function logout(){
  localStorage.removeItem("userData");
  window.location.href = "index.html";
}
</script>
