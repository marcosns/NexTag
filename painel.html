<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel NexTag</title>

  <!-- Ícones -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body{
      margin:0;
      font-family: Arial;
      background:#111;
      color:#fff;
    }

    .container{
      max-width:900px;
      margin:40px auto;
      padding:20px;
      border-radius:12px;
      background:rgba(0,0,0,0.4);
    }

    input, select, button{
      padding:10px;
      margin:5px;
      border-radius:6px;
      border:none;
    }

    button{
      cursor:pointer;
      background:#333;
      color:#fff;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse: collapse;
    }

    td{
      padding:10px;
      border-bottom:1px solid #555;
    }

    .actions button{
      margin-right:5px;
    }

    #logoProjeto{
      max-height:80px;
      margin-bottom:15px;
      display:none;
    }

    /* modal */
    .modal{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.7);
      display:none;
      align-items:center;
      justify-content:center;
    }

    .modal-content{
      background:#222;
      padding:20px;
      border-radius:10px;
      width:300px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginDiv" class="container">
  <h2>Login</h2>
  <input id="usuario" placeholder="Usuário"><br>
  <input id="senha" type="password" placeholder="Senha"><br>
  <button onclick="login()">Entrar</button>
</div>

<!-- PAINEL -->
<div id="painel" class="container" style="display:none">

  <img id="logoProjeto">

  <h2>Painel</h2>

  <select id="projetoSelect" onchange="selecionarProjeto()"></select>

  <button onclick="abrirModal()">+ Arquivo</button>
  <button onclick="abrirHistorico()">Histórico</button>
  <button onclick="logout()">Sair</button>

  <table>
    <tbody id="listaArquivos"></tbody>
  </table>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Novo Arquivo</h3>
    <input id="nomeArquivo" placeholder="Nome"><br>
    <input id="fileLink" placeholder="Link"><br>
    <button onclick="salvar()">Salvar</button>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>

<!-- HISTÓRICO -->
<div id="modalHistorico" class="modal">
  <div class="modal-content">
    <h3>Histórico</h3>
    <div id="conteudoHistorico"></div>
    <button onclick="fecharHistorico()">Fechar</button>
  </div>
</div>

<!-- SCRIPT -->
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let projetosPermitidos = [];
let projetoAtual = null;
let iconeSelecionado = "fas fa-file";

let loginDiv, painel, projetoSelect, listaArquivos, logoProjeto;
let modal, modalHistorico, conteudoHistorico;
let nomeArquivo, fileLink;

/* API */
function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb;
  document.body.appendChild(script);
}

/* INIT */
window.onload = function(){

  loginDiv = document.getElementById("loginDiv");
  painel = document.getElementById("painel");
  projetoSelect = document.getElementById("projetoSelect");
  listaArquivos = document.getElementById("listaArquivos");
  logoProjeto = document.getElementById("logoProjeto");

  modal = document.getElementById("modal");
  modalHistorico = document.getElementById("modalHistorico");
  conteudoHistorico = document.getElementById("conteudoHistorico");

  nomeArquivo = document.getElementById("nomeArquivo");
  fileLink = document.getElementById("fileLink");

  const userData = localStorage.getItem("userData");

  if(userData){
    const data = JSON.parse(userData);

    projetosPermitidos = data.projetos;

    loginDiv.style.display="none";
    painel.style.display="block";

    carregarProjetos();

  }else{
    loginDiv.style.display="block";
    painel.style.display="none";
  }
}

/* LOGIN */
function login(){
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  chamarAPI({
    action:"login",
    usuario,
    senha,
    tipo:"painel"
  }, res=>{

    if(res.ok){
      projetosPermitidos = res.projetos;
      localStorage.setItem("userData", JSON.stringify(res));

      loginDiv.style.display="none";
      painel.style.display="block";

      carregarProjetos();
    }else{
      alert("Login inválido");
    }
  });
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}

/* PROJETOS */
function carregarProjetos(){
  chamarAPI({action:"getProjetos"}, res=>{

    projetoSelect.innerHTML="";

    res.projetos.forEach(p=>{
      if(projetosPermitidos.includes(String(p.id_projeto))){
        const opt = document.createElement("option");
        opt.value = p.id_projeto;
        opt.textContent = p.nome;
        projetoSelect.appendChild(opt);
      }
    });
  });
}

/* SELECIONAR */
function selecionarProjeto(){
  projetoAtual = projetoSelect.value;
  carregarArquivos();
}

/* ARQUIVOS */
function carregarArquivos(){
  chamarAPI({action:"getArquivos",projeto:projetoAtual}, res=>{

    listaArquivos.innerHTML="";

    res.arquivos.forEach(a=>{
      const tr = document.createElement("tr");

      tr.innerHTML =
        "<td>"+a.nome+"</td>" +
        "<td class='actions'>" +
        "<button onclick='window.open("+JSON.stringify(a.link)+")'>👁️</button>" +
        "<button onclick='excluirArquivo("+JSON.stringify(a.nome)+")'>🗑️</button>" +
        "</td>";

      listaArquivos.appendChild(tr);
    });
  });
}

/* MODAIS */
function abrirModal(){ modal.style.display="flex"; }
function fecharModal(){ modal.style.display="none"; }

function abrirHistorico(){
  modalHistorico.style.display="flex";

  chamarAPI({action:"getHistorico", projeto:projetoAtual}, res=>{
    conteudoHistorico.innerHTML = "";

    (res.historico || []).forEach(h=>{
      conteudoHistorico.innerHTML += `<div>${h.nome} - ${h.acao}</div>`;
    });
  });
}
function fecharHistorico(){ modalHistorico.style.display="none"; }

/* AÇÕES */
function salvar(){
  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value
  }, ()=>{
    fecharModal();
    carregarArquivos();
  });
}

function excluirArquivo(nome){
  if(confirm("Excluir?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome
    }, carregarArquivos);
  }
}
</script>

</body>
</html>
