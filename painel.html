<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let projetosPermitidos = [];
let projetoAtual = null;
let iconeSelecionado = "fas fa-file";

/* 🔥 SEM VARIÁVEIS GLOBAIS FIXAS */
function el(id){
  return document.getElementById(id);
}

/* API */
function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb;
  document.body.appendChild(script);
}

/* INIT SEGURO 🔥 */
window.addEventListener("DOMContentLoaded", () => {

  const loginDiv = el("loginDiv");
  const painel = el("painel");

  if(!loginDiv || !painel){
    console.error("HTML não carregado corretamente");
    return;
  }

  const userData = localStorage.getItem("userData");

  if(userData){
    const data = JSON.parse(userData);
    projetosPermitidos = data.projetos;

    loginDiv.style.display="none";
    painel.style.display="block";

    carregarProjetos();
  }else{
    loginDiv.style.display="block";
    painel.style.display="none";
  }
});

/* LOGIN */
function login(){
  const usuario = el("usuario").value;
  const senha = el("senha").value;

  chamarAPI({
    action:"login",
    usuario,
    senha,
    tipo:"painel"
  }, res=>{

    if(res.ok){

      projetosPermitidos = res.projetos;
      localStorage.setItem("userData", JSON.stringify(res));

      el("loginDiv").style.display="none";
      el("painel").style.display="block";

      carregarProjetos();

    }else{
      alert(res.erro || "Login inválido");
    }

  });
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}

/* PROJETOS */
function carregarProjetos(){
  const select = el("projetoSelect");
  if(!select) return;

  chamarAPI({action:"getProjetos"}, res=>{

    select.innerHTML="";

    const placeholder = document.createElement("option");
    placeholder.text = "Selecione o projeto";
    placeholder.disabled = true;
    placeholder.selected = true;
    select.add(placeholder);

    res.projetos.forEach(p=>{
      if(projetosPermitidos.includes(String(p.id_projeto))){

        const opt = document.createElement("option");
        opt.value = p.id_projeto;
        opt.textContent = p.nome;

        opt.dataset.logo = p.logo || "";
        opt.dataset.background = p.background || "";
        opt.dataset.glass = p.glass_effect || "escuro";

        select.appendChild(opt);
      }
    });

  });
}

/* VISUAL */
function aplicarVisualProjeto(data){

  document.body.style.background = data.background
    ? `url('${data.background}') center/cover no-repeat`
    : "#111";

  const logo = el("logoProjeto");

  if(logo){
    if(data.logo){
      logo.src = data.logo;
      logo.style.display = "block";
    }else{
      logo.style.display = "none";
    }
  }

  data.glass_effect === "claro"
    ? aplicarTemaClaro()
    : aplicarTemaEscuro();
}

/* TEMAS */
function aplicarTemaClaro(){
  document.body.style.color = "#111";
  const c = document.querySelector(".container");
  if(c) c.style.background = "rgba(255,255,255,0.65)";
}

function aplicarTemaEscuro(){
  document.body.style.color = "#fff";
  const c = document.querySelector(".container");
  if(c) c.style.background = "rgba(0,0,0,0.4)";
}

/* SELEÇÃO */
function selecionarProjeto(){
  const select = el("projetoSelect");
  if(!select || !select.value) return;

  projetoAtual = select.value;

  const opt = select.selectedOptions[0];

  aplicarVisualProjeto({
    logo: opt.dataset.logo,
    background: opt.dataset.background,
    glass_effect: opt.dataset.glass
  });

  carregarArquivos();
}

/* ARQUIVOS */
function carregarArquivos(){
  const lista = el("listaArquivos");
  if(!lista) return;

  chamarAPI({action:"getArquivos",projeto:projetoAtual}, res=>{

    lista.innerHTML="";

    res.arquivos.forEach(a=>{
      const tr = document.createElement("tr");

      tr.innerHTML =
        "<td><i class='"+a.icone+"'></i> "+a.nome+"</td>" +
        "<td class='actions'>" +
        "<button onclick='window.open("+JSON.stringify(a.link)+")'>👁️</button>" +
        "<button onclick='editarArquivo("+JSON.stringify(a.nome)+")'>✏️</button>" +
        "<button onclick='window.open("+JSON.stringify(a.link)+")'>⬇️</button>" +
        "<button onclick='excluirArquivo("+JSON.stringify(a.nome)+")'>🗑️</button>" +
        "</td>";

      lista.appendChild(tr);
    });

  });
}

/* MODAIS */
function abrirModal(){ const m = el("modal"); if(m) m.style.display="flex"; }
function fecharModal(){ const m = el("modal"); if(m) m.style.display="none"; }

function abrirHistorico(){
  const modal = el("modalHistorico");
  const conteudo = el("conteudoHistorico");

  if(modal) modal.style.display="flex";

  chamarAPI({action:"getHistorico", projeto:projetoAtual}, res=>{
    if(!conteudo) return;

    conteudo.innerHTML = "";

    (res.historico || []).forEach(h=>{
      conteudo.innerHTML += `<div>${h.nome} - ${h.acao}</div>`;
    });
  });
}

function fecharHistorico(){ const m = el("modalHistorico"); if(m) m.style.display="none"; }

function abrirInstrucoes(){ const m = el("modalInstrucoes"); if(m) m.style.display="flex"; }
function fecharInstrucoes(){ const m = el("modalInstrucoes"); if(m) m.style.display="none"; }

/* AÇÕES */
function salvar(){
  const nome = el("nomeArquivo");
  const link = el("fileLink");

  if(!nome || !link) return;

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nome.value,
    link:link.value,
    icone:iconeSelecionado
  }, ()=>{
    fecharModal();
    carregarArquivos();
  });
}

function editarArquivo(nome){
  const novo = prompt("Novo link:");
  if(!novo) return;

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome,
    link:novo
  }, carregarArquivos);
}

function excluirArquivo(nome){
  if(confirm("Excluir?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome
    }, carregarArquivos);
  }
}
</script>
