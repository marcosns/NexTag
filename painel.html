<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel NexTag</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:#111827;
  color:#fff;
}

.logo-box{
  background:#fff;
  padding:5px 10px;
  border-radius:8px;
}

.logo{
  height:40px;
}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
}

/* BOTÕES */
button{
  cursor:pointer;
  border:none;
  padding:8px 12px;
  border-radius:6px;
}

.btn{
  background:#2563eb;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

/* CONTEÚDO */
.container{
  padding:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:320px;
}

input, select{
  width:100%;
  padding:8px;
  margin:5px 0;
}

/* ICON SELECT */
.icon-option{
  font-size:18px;
}

/* VIEWER */
.viewer{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  flex-direction:column;
}

.viewer iframe{
  flex:1;
  border:none;
}

.viewer .top{
  padding:10px;
  background:#111;
  color:#fff;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<div class="header">

  <div class="logo-box">
    <img src="nextag_logo.png" class="logo">
  </div>

  <div class="user-area">

    <select id="projetoSelect"></select>

    <span id="userNome"></span>

    <button class="btn" onclick="abrirTag()">
      <i class="fas fa-eye"></i>
    </button>

    <button class="btn-danger" onclick="logout()">
      <i class="fas fa-right-from-bracket"></i>
    </button>

  </div>
</div>

<div class="container">

  <button class="btn" onclick="abrirModal()">
    <i class="fas fa-plus"></i> Novo Arquivo
  </button>

  <div id="lista"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">

    <h3 id="modalTitulo">Arquivo</h3>

    <input id="nome" placeholder="Nome do arquivo">
    <input id="link" placeholder="Link">

    <select id="icone">
      <option value="fas fa-file">📄 Arquivo</option>
      <option value="fas fa-file-pdf">📕 PDF</option>
      <option value="fas fa-image">🖼 Imagem</option>
      <option value="fas fa-video">🎥 Vídeo</option>
      <option value="fas fa-file-word">📘 Word</option>
    </select>

    <button class="btn" onclick="salvar()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>

  </div>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <div class="top">
    <button onclick="fecharViewer()">Fechar</button>
    <a id="download" target="_blank">
      <button>Download</button>
    </a>
  </div>
  <iframe id="frame"></iframe>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let user = JSON.parse(localStorage.getItem("userData"));
let projetoAtual = null;

/* PROTEÇÃO */
if(!user){
  window.location.href = "index.html";
}

/* USER */
document.getElementById("userNome").innerText = user.usuario;

/* API */
function api(params, cb){
  const s = document.createElement("script");
  const callback = "cb_"+Date.now();

  window[callback] = res=>{
    cb(res);
    delete window[callback];
    s.remove();
  };

  s.src = API + "?" + new URLSearchParams(params) + "&callback=" + callback;
  document.body.appendChild(s);
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("userData");
  window.location.href = "index.html";
}

/* TAG */
function abrirTag(){
  window.open("tag.html?projeto="+projetoAtual, "_blank");
}

/* PROJETOS */
function carregarProjetos(){

  const select = document.getElementById("projetoSelect");
  select.innerHTML = "";

  user.projetos.forEach(p=>{
    select.innerHTML += `<option value="${p}">${p}</option>`;
  });

  projetoAtual = user.projetos[0];

  select.onchange = ()=>{
    projetoAtual = select.value;
    carregarArquivos();
  };

  carregarArquivos();
}

/* ARQUIVOS */
function carregarArquivos(){

  api({
    action:"getArquivos",
    projeto:projetoAtual
  }, res=>{

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    res.arquivos.forEach(a=>{
      lista.innerHTML += `
        <div class="card">
          <div>
            <i class="${a.icone}"></i> ${a.nome}
          </div>

          <div>
            <button onclick='visualizar("${a.link}")'><i class="fas fa-eye"></i></button>
            <button onclick='editar(${JSON.stringify(a)})'><i class="fas fa-pen"></i></button>
            <button onclick='excluir("${a.nome}")'><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `;
    });

  });
}

/* MODAL */
function abrirModal(){
  limparFormulario();
  document.getElementById("modal").style.display="flex";
}

function fecharModal(){
  document.getElementById("modal").style.display="none";
}

/* LIMPAR BUG */
function limparFormulario(){
  document.getElementById("nome").value = "";
  document.getElementById("link").value = "";
  document.getElementById("icone").value = "fas fa-file";
}

/* EDITAR */
function editar(a){

  limparFormulario();

  document.getElementById("nome").value = a.nome;
  document.getElementById("link").value = a.link;
  document.getElementById("icone").value = a.icone;

  abrirModal();
}

/* SALVAR */
function salvar(){

  api({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:document.getElementById("nome").value,
    link:document.getElementById("link").value,
    icone:document.getElementById("icone").value,
    usuario:user.usuario
  }, ()=>{
    fecharModal();
    carregarArquivos();
  });
}

/* EXCLUIR */
function excluir(nome){
  if(!confirm("Excluir arquivo?")) return;

  api({
    action:"deleteArquivo",
    projeto:projetoAtual,
    nome,
    usuario:user.usuario
  }, carregarArquivos);
}

/* VIEWER */
function visualizar(link){
  document.getElementById("viewer").style.display="flex";
  document.getElementById("frame").src = link;
  document.getElementById("download").href = link;
}

function fecharViewer(){
  document.getElementById("viewer").style.display="none";
}

/* INIT */
carregarProjetos();

</script>

</body>
</html>
