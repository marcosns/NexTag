<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel NexTag</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f9;
}

header{
  background:#0d1b2a;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  padding:20px;
}

.file{
  background:#fff;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
}

button{
  border:none;
  padding:8px 12px;
  margin:2px;
  border-radius:6px;
  cursor:pointer;
}

.actions button{
  background:#eee;
}

.add-btn{
  background:#00c3ff;
  color:#fff;
}

#modal, #previewModal{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:300px;
}

.preview-box{
  width:80%;
  height:80%;
  background:#fff;
}

.preview-box iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<header>
  <div>
    <b>NexTag</b>
  </div>

  <div>
    <span id="userNome"></span>
    <button onclick="logout()">
      <i class="fas fa-right-from-bracket"></i>
    </button>
  </div>
</header>

<div class="container">

  <select id="projetoSelect" onchange="selecionarProjeto()"></select>

  <select id="ordem" onchange="ordenar()">
    <option value="az">A-Z</option>
    <option value="za">Z-A</option>
  </select>

  <button class="add-btn" onclick="abrirModal()">
    <i class="fas fa-plus"></i> Adicionar
  </button>

  <div id="listaArquivos"></div>

</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">

    <input id="nomeArquivo" placeholder="Nome"><br><br>
    <input id="fileLink" placeholder="Link"><br><br>

    <button onclick="salvar()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>

  </div>
</div>

<!-- PREVIEW -->
<div id="previewModal"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let arquivos = [];
let projetoAtual = null;
let usuarioLogado = null;

/* LOGIN CHECK */
document.addEventListener("DOMContentLoaded", () => {

  const userData = JSON.parse(localStorage.getItem("userData") || "null");

  if(!userData){
    window.location.href = "index.html";
    return;
  }

  usuarioLogado = userData.usuario;
  document.getElementById("userNome").innerText = usuarioLogado;

  carregarProjetos();
});

/* API */
function chamarAPI(params, callback){

  const cb = "cb_" + Date.now();

  window[cb] = function(data){
    callback(data);
    delete window[cb];
  };

  const script = document.createElement("script");
  script.src = API_URL + "?" + new URLSearchParams({...params, callback:cb});
  document.body.appendChild(script);
}

/* PROJETOS */
function carregarProjetos(){

  chamarAPI({action:"getProjetos"}, res=>{
    const select = document.getElementById("projetoSelect");

    select.innerHTML = "<option>Selecione</option>";

    res.projetos.forEach(p=>{
      select.innerHTML += `<option value="${p.id_projeto}">${p.nome}</option>`;
    });
  });
}

/* SELECIONAR */
function selecionarProjeto(){
  projetoAtual = document.getElementById("projetoSelect").value;
  carregarArquivos();
}

/* ARQUIVOS */
function carregarArquivos(){

  chamarAPI({action:"getArquivos", projeto:projetoAtual}, res=>{
    arquivos = res.arquivos || [];
    render();
  });
}

/* RENDER */
function render(){

  const lista = document.getElementById("listaArquivos");
  lista.innerHTML = "";

  arquivos.forEach(a=>{

    lista.innerHTML += `
      <div class="file">
        <div><i class="${a.icone}"></i> ${a.nome}</div>

        <div class="actions">
          <button onclick="preview('${a.link}')"><i class="fas fa-eye"></i></button>
          <button onclick="excluir('${a.nome}')"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    `;
  });
}

/* ORDENAÇÃO */
function ordenar(){

  const tipo = document.getElementById("ordem").value;

  if(tipo==="az"){
    arquivos.sort((a,b)=>a.nome.localeCompare(b.nome));
  }else{
    arquivos.sort((a,b)=>b.nome.localeCompare(a.nome));
  }

  render();
}

/* MODAL */
function abrirModal(){
  document.getElementById("modal").style.display="flex";
}

function fecharModal(){
  document.getElementById("modal").style.display="none";
}

/* SALVAR */
function salvar(){

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value,
    usuario:usuarioLogado
  }, ()=>{
    fecharModal();
    carregarArquivos();
  });
}

/* EXCLUIR */
function excluir(nome){

  if(confirm("Excluir?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome,
      usuario:usuarioLogado
    }, carregarArquivos);
  }
}

/* PREVIEW */
function preview(link){

  const modal = document.getElementById("previewModal");

  modal.innerHTML = `
    <div class="preview-box">
      <iframe src="${link}"></iframe>
    </div>
  `;

  modal.style.display="flex";
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("userData");
  window.location.href = "index.html";
}
</script>

</body>
</html>
