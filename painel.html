<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let projetosPermitidos = [];
let projetoAtual = null;
let iconeSelecionado = "fas fa-file";

/* ELEMENTOS GLOBAIS 🔥 */
let loginDiv, painel, projetoSelect, listaArquivos, logoProjeto;
let modal, modalHistorico, modalInstrucoes, conteudoHistorico;
let nomeArquivo, fileLink;

/* API */
function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb;
  document.body.appendChild(script);
}

/* INIT */
window.onload = function(){

  // principais
  loginDiv = document.getElementById("loginDiv");
  painel = document.getElementById("painel");
  projetoSelect = document.getElementById("projetoSelect");
  listaArquivos = document.getElementById("listaArquivos");
  logoProjeto = document.getElementById("logoProjeto");

  // modais
  modal = document.getElementById("modal");
  modalHistorico = document.getElementById("modalHistorico");
  modalInstrucoes = document.getElementById("modalInstrucoes");
  conteudoHistorico = document.getElementById("conteudoHistorico");

  // inputs
  nomeArquivo = document.getElementById("nomeArquivo");
  fileLink = document.getElementById("fileLink");

  if(!loginDiv || !painel){
    console.error("Elementos principais não encontrados");
    return;
  }

  const userData = localStorage.getItem("userData");

  if(userData){
    const data = JSON.parse(userData);
    projetosPermitidos = data.projetos;

    loginDiv.style.display="none";
    painel.style.display="block";

    carregarProjetos();

  }else{
    loginDiv.style.display="block";
    painel.style.display="none";
  }
}

/* LOGIN */
function login(){
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  chamarAPI({
    action:"login",
    usuario,
    senha,
    tipo:"painel"
  }, res=>{

    if(res.ok){

      projetosPermitidos = res.projetos;
      localStorage.setItem("userData", JSON.stringify(res));

      loginDiv.style.display="none";
      painel.style.display="block";

      carregarProjetos();

    }else{
      alert(res.erro || "Login inválido");
    }

  });
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}

/* PROJETOS */
function carregarProjetos(){
  if(!projetoSelect) return;

  chamarAPI({action:"getProjetos"}, res=>{

    projetoSelect.innerHTML="";

    const placeholder = document.createElement("option");
    placeholder.text = "Selecione o projeto";
    placeholder.disabled = true;
    placeholder.selected = true;
    projetoSelect.add(placeholder);

    res.projetos.forEach(p=>{
      if(projetosPermitidos.includes(String(p.id_projeto))){

        const opt = document.createElement("option");
        opt.value = p.id_projeto;
        opt.textContent = p.nome;

        opt.dataset.logo = p.logo || "";
        opt.dataset.background = p.background || "";
        opt.dataset.glass = p.glass_effect || "escuro";

        projetoSelect.appendChild(opt);
      }
    });

  });
}

/* VISUAL */
function aplicarVisualProjeto(data){

  document.body.style.background = data.background
    ? `url('${data.background}') center/cover no-repeat`
    : "#111";

  if(logoProjeto){
    if(data.logo){
      logoProjeto.src = data.logo;
      logoProjeto.style.display = "block";
    }else{
      logoProjeto.style.display = "none";
    }
  }

  data.glass_effect === "claro"
    ? aplicarTemaClaro()
    : aplicarTemaEscuro();
}

/* TEMAS */
function aplicarTemaClaro(){
  document.body.style.color = "#111";
  const c = document.querySelector(".container");
  if(c) c.style.background = "rgba(255,255,255,0.65)";
}

function aplicarTemaEscuro(){
  document.body.style.color = "#fff";
  const c = document.querySelector(".container");
  if(c) c.style.background = "rgba(0,0,0,0.4)";
}

/* SELEÇÃO */
function selecionarProjeto(){
  if(!projetoSelect.value) return;

  projetoAtual = projetoSelect.value;
  const opt = projetoSelect.selectedOptions[0];

  aplicarVisualProjeto({
    logo: opt.dataset.logo,
    background: opt.dataset.background,
    glass_effect: opt.dataset.glass
  });

  carregarArquivos();
}

/* ARQUIVOS */
function carregarArquivos(){
  if(!listaArquivos) return;

  chamarAPI({action:"getArquivos",projeto:projetoAtual}, res=>{

    listaArquivos.innerHTML="";

    res.arquivos.forEach(a=>{
      const tr = document.createElement("tr");

      tr.innerHTML =
        "<td><i class='"+a.icone+"'></i> "+a.nome+"</td>" +
        "<td class='actions'>" +
        "<button onclick='window.open("+JSON.stringify(a.link)+")'>👁️</button>" +
        "<button onclick='editarArquivo("+JSON.stringify(a.nome)+")'>✏️</button>" +
        "<button onclick='window.open("+JSON.stringify(a.link)+")'>⬇️</button>" +
        "<button onclick='excluirArquivo("+JSON.stringify(a.nome)+")'>🗑️</button>" +
        "</td>";

      listaArquivos.appendChild(tr);
    });

  });
}

/* MODAIS */
function abrirModal(){ if(modal) modal.style.display="flex"; }
function fecharModal(){ if(modal) modal.style.display="none"; }

function abrirHistorico(){
  if(modalHistorico) modalHistorico.style.display="flex";

  chamarAPI({action:"getHistorico", projeto:projetoAtual}, res=>{
    if(!conteudoHistorico) return;

    conteudoHistorico.innerHTML = "";

    (res.historico || []).forEach(h=>{
      conteudoHistorico.innerHTML += `<div>${h.nome} - ${h.acao}</div>`;
    });
  });
}
function fecharHistorico(){ if(modalHistorico) modalHistorico.style.display="none"; }

function abrirInstrucoes(){ if(modalInstrucoes) modalInstrucoes.style.display="flex"; }
function fecharInstrucoes(){ if(modalInstrucoes) modalInstrucoes.style.display="none"; }

/* AÇÕES */
function salvar(){
  if(!nomeArquivo || !fileLink) return;

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value,
    icone:iconeSelecionado
  }, ()=>{
    fecharModal();
    carregarArquivos();
  });
}

function editarArquivo(nome){
  const novo = prompt("Novo link:");
  if(!novo) return;

  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome,
    link:novo
  }, carregarArquivos);
}

function excluirArquivo(nome){
  if(confirm("Excluir?")){
    chamarAPI({
      action:"deleteArquivo",
      projeto:projetoAtual,
      nome
    }, carregarArquivos);
  }
}
</script>
