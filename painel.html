<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel NexTag</title>

<link rel="icon" href="https://raw.githubusercontent.com/marcosns/NexTag/main/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:url('https://raw.githubusercontent.com/marcosns/NexTag/main/fundo6.jpg') center/cover fixed;
  color:#fff;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  padding:15px 25px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

.top-bar .right{
  display:flex;
  gap:10px;
  align-items:center;
}

.main{
  display:flex;
}

.sidebar{
  width:250px;
  background:rgba(0,0,0,0.5);
  padding:20px;
}

.content{
  flex:1;
  padding:20px;
}

.file{
  display:flex;
  justify-content:space-between;
  padding:10px;
  margin-bottom:10px;
  background:rgba(255,255,255,0.08);
  border-radius:10px;
}

.actions button{
  margin-left:5px;
}
.modal{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.7);
}
.modal-content{
  background:#222;
  padding:20px;
  border-radius:10px;
}
.icon-picker i{
  margin:5px;
  padding:10px;
  background:#333;
  cursor:pointer;
}
.icon-picker i.selected{
  background:#4CAF50;
}
</style>
</head>

<body>

<!-- TOPO -->
<div class="top-bar">
  <div>
    <button onclick="abrirHistorico()">📜 Histórico</button>
  </div>

  <div class="right">
    👤 <span id="userNome"></span>
    <button onclick="toggleTema()">🌙</button>
    <button onclick="logout()">✖</button>
  </div>
</div>

<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <img src="https://raw.githubusercontent.com/marcosns/NexTag/main/nextag_logo.png" width="150">

    <p>Bem vindo ao portal NexTag</p>

    <select id="projetoSelect" onchange="selecionarProjeto()"></select>

    <select id="ordem" onchange="ordenar()">
      <option value="az">A-Z</option>
      <option value="za">Z-A</option>
    </select>

  </div>

  <!-- CONTEÚDO -->
  <div class="content">

    <h2>Arquivos</h2>

    <div id="listaArquivos"></div>

  </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">

    <input id="nomeArquivo" placeholder="Nome"><br><br>

    <input id="fileLink" placeholder="Link"><br><br>

    <p>Selecione o ícone:</p>

    <div class="icon-picker">
      <i class="fas fa-file" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-file-pdf" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-image" onclick="selecionarIcone(this)"></i>
      <i class="fas fa-folder" onclick="selecionarIcone(this)"></i>
    </div>

    <br>
    <button onclick="salvar()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>

  </div>
</div>

<!-- SCRIPT -->
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

let arquivos = [];
let projetoAtual = null;
let iconeSelecionado = "fas fa-file";

/* API */
function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb;
  document.body.appendChild(script);
}

/* INIT */
window.onload = function(){
  const userData = JSON.parse(localStorage.getItem("userData") || "{}");
  document.getElementById("userNome").innerText = userData.usuario || "Usuário";
  carregarProjetos();
}

/* PROJETOS */
function carregarProjetos(){
  chamarAPI({action:"getProjetos"}, res=>{
    const select = document.getElementById("projetoSelect");
    select.innerHTML = "<option value=''>Selecione o projeto</option>";

    res.projetos.forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.id_projeto;
      opt.textContent = p.nome;
      select.appendChild(opt);
    });
  });
}

/* SELECIONAR */
function selecionarProjeto(){
  projetoAtual = document.getElementById("projetoSelect").value;
  if(!projetoAtual) return;
  carregarArquivos();
}

/* ARQUIVOS */
function carregarArquivos(){
  chamarAPI({action:"getArquivos", projeto:projetoAtual}, res=>{
    arquivos = res.arquivos || [];
    render();
  });
}

/* RENDER */
function render(){
  const lista = document.getElementById("listaArquivos");
  lista.innerHTML="";

  arquivos.forEach(a=>{
    lista.innerHTML += `
      <div class="file">
        <div><i class="${a.icone}"></i> ${a.nome}</div>
        <div class="actions">
          <button onclick="window.open('${a.link}')">👁️</button>
          <button onclick="editar('${a.nome}','${a.link}','${a.icone}')">✏️</button>
          <button onclick="excluir('${a.nome}')">🗑️</button>
        </div>
      </div>
    `;
  });
}

/* EDITAR */
function editar(nome,link,icone){
  modal.style.display="flex";
  nomeArquivo.value = nome;
  fileLink.value = link;
  iconeSelecionado = icone;
}

/* SALVAR */
function salvar(){
  chamarAPI({
    action:"addArquivo",
    projeto:projetoAtual,
    nome:nomeArquivo.value,
    link:fileLink.value,
    icone:iconeSelecionado
  }, ()=>{
    fecharModal();
    carregarArquivos();
  });
}

/* EXCLUIR */
function excluir(nome){
  if(confirm("Excluir?")){
    chamarAPI({action:"deleteArquivo", projeto:projetoAtual, nome}, carregarArquivos);
  }
}

/* ICON */
function selecionarIcone(el){
  document.querySelectorAll(".icon-picker i").forEach(i=>i.classList.remove("selected"));
  el.classList.add("selected");
  iconeSelecionado = el.className;
}

/* MODAL */
function fecharModal(){
  modal.style.display="none";
}

/* HISTORICO */
function abrirHistorico(){
  alert("Histórico em breve com data real");
}

/* TEMA */
function toggleTema(){
  document.body.classList.toggle("light");
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
