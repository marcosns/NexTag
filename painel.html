<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec";

/* 🔥 FUNÇÃO GLOBAL QUE O BACKEND CHAMA */
function teste(res){

  console.log("🔎 RESPOSTA API:", res);

  if(res && res.ok){

    localStorage.setItem("userData", JSON.stringify(res));

    console.log("✅ Login OK");
    window.location.href = "painel.html";

  }else{

    console.warn("❌ Login falhou:", res);
    alert(res?.erro || "Login inválido");

  }
}

/* LOGIN */
function login(){

  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  if(!usuario || !senha){
    alert("Preencha usuário e senha");
    return;
  }

  const script = document.createElement("script");

  script.src = API_URL + "?" + new URLSearchParams({
    action:"login",
    usuario,
    senha,
    tipo:"painel"
  });

  document.body.appendChild(script);
}
</script>
