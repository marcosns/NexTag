<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexTag — Login</title>
<link rel="icon" href="https://raw.githubusercontent.com/marcosns/NexTag/main/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Card de login centralizado ── */
.card {
  background: #fff;
  border-radius: 16px;
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}

/* ── Logo no topo do card ── */
.logo-wrap {
  text-align: center;
  margin-bottom: 28px;
}
.logo-wrap img {
  height: 48px;
}

h2 {
  font-size: 20px;
  font-weight: 600;
  color: #111827;
  margin-bottom: 4px;
  text-align: center;
}
.subtitulo {
  font-size: 14px;
  color: #6b7280;
  text-align: center;
  margin-bottom: 24px;
}

/* ── Campos do formulário ── */
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #374151;
  margin-bottom: 4px;
}
input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  color: #111827;
  margin-bottom: 16px;
  outline: none;
  transition: border-color .2s;
}
input:focus { border-color: #2563eb; }

/* ── Botão principal ── */
.btn {
  width: 100%;
  padding: 11px;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:hover { background: #1d4ed8; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── Spinner de loading no botão ── */
.spinner {
  display: none;
  width: 16px; height: 16px;
  border: 2px solid #ffffff55;
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Mensagem de erro ── */
.erro {
  color: #dc2626;
  font-size: 13px;
  margin-top: -8px;
  margin-bottom: 12px;
  display: none;
}

/* ── Link "Esqueci minha senha" ── */
.link-reset {
  display: block;
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: #2563eb;
  text-decoration: none;
  cursor: pointer;
}
.link-reset:hover { text-decoration: underline; }

/* ── Seção de reset (oculta inicialmente) ── */
.secao-reset { display: none; }
.secao-login { display: block; }

.msg-sucesso {
  color: #16a34a;
  font-size: 13px;
  text-align: center;
  margin-top: 8px;
  display: none;
}

.voltar {
  display: block;
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
  color: #6b7280;
  cursor: pointer;
}
.voltar:hover { color: #111827; }
</style>
</head>
<body>

<div class="card">

  <!-- ── Logo ── -->
  <div class="logo-wrap">
    <img src="nextag_logo.png" alt="NexTag" onerror="this.style.display='none'">
  </div>

  <!-- ══════════════════════════════════
       SEÇÃO: LOGIN
  ══════════════════════════════════ -->
  <div class="secao-login" id="secaoLogin">
    <h2>Entrar no painel</h2>
    <p class="subtitulo">Gerencie seus projetos NexTag</p>

    <label for="usuario">Usuário</label>
    <input id="usuario" type="text" placeholder="Seu usuário" autocomplete="username">

    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') fazerLogin()">

    <p id="erroLogin" class="erro"></p>

    <button class="btn" id="btnLogin" onclick="fazerLogin()">
      <span id="labelLogin">Entrar</span>
      <span class="spinner" id="spinnerLogin"></span>
    </button>

    <a class="link-reset" onclick="mostrarReset()">Esqueci minha senha</a>
  </div>

  <!-- ══════════════════════════════════
       SEÇÃO: ESQUECI MINHA SENHA
  ══════════════════════════════════ -->
  <div class="secao-reset" id="secaoReset">
    <h2>Recuperar acesso</h2>
    <p class="subtitulo">Informe seu usuário e enviaremos um link para redefinir a senha</p>

    <label for="usuarioReset">Usuário</label>
    <input id="usuarioReset" type="text" placeholder="Seu usuário">

    <p id="erroReset" class="erro"></p>
    <p id="sucessoReset" class="msg-sucesso"></p>

    <button class="btn" id="btnReset" onclick="solicitarReset()">
      <span id="labelReset">Enviar link</span>
      <span class="spinner" id="spinnerReset"></span>
    </button>

    <span class="voltar" onclick="mostrarLogin()">← Voltar para o login</span>
  </div>

</div>

<script>
// ── URL do backend Apps Script ──
const API = "https://script.google.com/macros/s/AKfycby-goyk5onX2MtZEqoF1ggIRGmuN7yqN1guhltp8gKyJxBCmcf3sg7M5PMWHCr3SqPbNw/exec";

// ── Chama a API via JSONP com timeout de 12s ──
function api(params, cb, onErro) {
  const s = document.createElement("script");
  const cbName = "cb_" + Date.now();

  const timer = setTimeout(() => {
    delete window[cbName];
    s.remove();
    if (onErro) onErro("Tempo de resposta esgotado. Tente novamente.");
  }, 12000);

  window[cbName] = res => {
    clearTimeout(timer);
    delete window[cbName];
    s.remove();
    cb(res);
  };
  s.src = API + "?" + new URLSearchParams(params) + "&callback=" + cbName;
  document.body.appendChild(s);
}

// ── Alterna para tela de recuperação de senha ──
function mostrarReset() {
  document.getElementById("secaoLogin").style.display = "none";
  document.getElementById("secaoReset").style.display = "block";
  document.getElementById("erroReset").style.display = "none";
  document.getElementById("sucessoReset").style.display = "none";
  document.getElementById("usuarioReset").value = "";
}

// ── Volta para tela de login ──
function mostrarLogin() {
  document.getElementById("secaoReset").style.display = "none";
  document.getElementById("secaoLogin").style.display = "block";
  document.getElementById("erroLogin").style.display = "none";
}

// ── Login: autentica e redireciona para o painel ──
function fazerLogin() {
  const usuario = document.getElementById("usuario").value.trim();
  const senha   = document.getElementById("senha").value;
  const erro    = document.getElementById("erroLogin");
  const btn     = document.getElementById("btnLogin");
  const spinner = document.getElementById("spinnerLogin");
  const label   = document.getElementById("labelLogin");

  erro.style.display = "none";

  if (!usuario || !senha) {
    erro.textContent   = "Preencha usuário e senha.";
    erro.style.display = "block";
    return;
  }

  btn.disabled          = true;
  spinner.style.display = "inline-block";
  label.textContent     = "Entrando…";

  api({ action: "login", usuario, senha }, res => {
    btn.disabled          = false;
    spinner.style.display = "none";
    label.textContent     = "Entrar";

    if (res.ok) {
      // Salva sessão mínima (sem senha) no localStorage
      localStorage.setItem("userData", JSON.stringify({
        usuario: res.usuario,
        token:   res.token,
        projetos: res.projetos,
        tipo:    res.tipo,
        instrucoes: res.instrucoes
      }));
      window.location.href = "painel.html";
    } else {
      erro.textContent   = res.erro || "Login inválido";
      erro.style.display = "block";
    }
  }, msg => {
    btn.disabled = false;
    spinner.style.display = "none";
    label.textContent = "Entrar";
    erro.textContent   = msg;
    erro.style.display = "block";
  });
}

// ── Solicitar reset: envia email com link ──
function solicitarReset() {
  const usuario = document.getElementById("usuarioReset").value.trim();
  const erro    = document.getElementById("erroReset");
  const sucesso = document.getElementById("sucessoReset");
  const btn     = document.getElementById("btnReset");
  const spinner = document.getElementById("spinnerReset");
  const label   = document.getElementById("labelReset");

  erro.style.display    = "none";
  sucesso.style.display = "none";

  if (!usuario) {
    erro.textContent   = "Informe seu usuário.";
    erro.style.display = "block";
    return;
  }

  btn.disabled          = true;
  spinner.style.display = "inline-block";
  label.textContent     = "Enviando…";

  api({ action: "solicitarReset", usuario }, res => {
    btn.disabled          = false;
    spinner.style.display = "none";
    label.textContent     = "Enviar link";

    if (res.ok) {
      sucesso.textContent   = res.mensagem;
      sucesso.style.display = "block";
    } else {
      erro.textContent   = res.erro || "Erro ao solicitar reset.";
      erro.style.display = "block";
    }
  }, msg => {
    btn.disabled          = false;
    spinner.style.display = "none";
    label.textContent     = "Enviar link";
    erro.textContent      = msg;
    erro.style.display    = "block";
  });
}

// ── Se já está logado, vai direto para o painel ──
window.onload = () => {
  const user = localStorage.getItem("userData");
  if (user) window.location.href = "painel.html";
};
</script>
</body>
</html>
