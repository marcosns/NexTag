<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexTag</title>

<link rel="icon" href="https://raw.githubusercontent.com/marcosns/NexTag/main/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  color:white;
  background:#111;
  background-size:cover;
  background-position:center;
}

/* login */
#loginBox{
  text-align:center;
  margin-top:80px;
  display:none;
}

input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  width:200px;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  background:#00c3ff;
  color:white;
  cursor:pointer;
}

/* container */
.container{
  display:none;
  backdrop-filter: blur(12px);
  border-radius:20px;
  padding:30px;
  width:90%;
  max-width:500px;
  margin:40px auto;
  text-align:center;
  transition:0.3s;
}

/* logo */
#logo{
  max-width:180px;
  margin-bottom:10px;
}

/* links */
a{
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:center;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  text-decoration:none;
  font-size:15px;
  transition:0.2s;
}
</style>

</head>

<body>

<div id="loginBox">
  <h2>Acesso restrito</h2>
  <input id="usuario" placeholder="Usuário"><br>
  <input id="senha" type="password" placeholder="Senha"><br>
  <button onclick="fazerLogin()">Entrar</button>
  <p id="erro" style="color:red;"></p>
</div>

<div class="container">
  <img id="logo">
  <h2 id="nome"></h2>
  <p id="descricao"></p>
  <div id="lista"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzv-05N6bhfLiuXLYK8L83_8erV7G9mAeiEZijGAs5xcojTVo3cE-e92g-OLMGFMt4gMQ/exec"";

/* JSONP */
function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb;

  document.body.appendChild(script);
}

/* projeto */
function getProjeto(){
  return new URLSearchParams(window.location.search).get("id");
}

/* LOGIN */
function fazerLogin(){

  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  chamarAPI({
    action:"login",
    usuario,
    senha,
    tipo:"tag"
  }, res=>{
    if(res.ok){
      localStorage.setItem("user", JSON.stringify(res));
      iniciarSistema(res);
    }else{
      document.getElementById("erro").innerText = res.erro || "Login inválido";
    }
  });
}

/* INICIO */
function iniciarSistema(user=null){

  const projeto = getProjeto();

  if(user && !user.projetos.includes(projeto)){
    alert("Sem acesso");
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.querySelector(".container").style.display="block";

  carregar(user);
}

/* CARREGAR */
function carregar(user){

  const projeto = getProjeto();

  chamarAPI({action:"getProjeto",id_projeto:projeto}, d=>{

    if(!d.projeto) return;

    const p = d.projeto;

    /* texto */
    nome.innerText = p.nome || "";
    descricao.innerText = p.descricao || "";

    /* visual */
    if(p.background){
      document.body.style.backgroundImage = `url('${p.background}')`;
    }

    if(p.logo){
      logo.src = p.logo;
    }

    /* 🔥 TEMA PELO SHEETS */
    if(p.glass_effect === "claro"){
      aplicarTemaClaro();
    }else{
      aplicarTemaEscuro();
    }

  });

  /* arquivos */
  chamarAPI({action:"getArquivos",projeto}, d=>{
    lista.innerHTML="";
    (d.arquivos||[]).forEach(a=>{
      const el = document.createElement("a");
      el.href = a.link;
      el.target="_blank";
      el.innerHTML = `<i class="${a.icone||'fas fa-file'}"></i> ${a.nome}`;
      lista.appendChild(el);
    });
  });
}

/* TEMAS */
function aplicarTemaClaro(){
  document.body.style.color="#111";

  document.querySelector(".container").style.background="rgba(255,255,255,0.6)";

  document.querySelectorAll("a").forEach(a=>{
    a.style.background="rgba(0,0,0,0.1)";
    a.style.color="#111";
  });
}

function aplicarTemaEscuro(){
  document.body.style.color="white";

  document.querySelector(".container").style.background="rgba(0,0,0,0.4)";

  document.querySelectorAll("a").forEach(a=>{
    a.style.background="rgba(255,255,255,0.1)";
    a.style.color="white";
  });
}

/* INIT */
window.onload = function(){

  const projeto = getProjeto();

  chamarAPI({action:"getAcessoTag", projeto}, res=>{

    if(res.acesso_tag === "livre"){
      iniciarSistema(); // 🔥 direto sem login
    }else{
      document.getElementById("loginBox").style.display="block";
    }

  });

};
</script>

</body>
</html>
