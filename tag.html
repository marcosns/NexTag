<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NexTag</title>
<link rel="icon" href="https://raw.githubusercontent.com/marcosns/NexTag/main/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════
   BASE
════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --glass-dark:rgba(10,12,20,.55);
  --glass-light:rgba(255,255,255,.55);
  --link-dark:rgba(255,255,255,.1);
  --link-light:rgba(0,0,0,.07);
  --link-dark-h:rgba(255,255,255,.18);
  --link-light-h:rgba(0,0,0,.13);
  --text-dark:#ffffff;
  --text-light:#0f172a;
  --muted-dark:rgba(255,255,255,.6);
  --muted-light:rgba(15,23,42,.5);
  --border-dark:rgba(255,255,255,.12);
  --border-light:rgba(0,0,0,.08);
}

html{height:100%;scroll-behavior:smooth}
body{
  min-height:100%;
  font-family:'DM Sans',system-ui,sans-serif;
  background:#111 center/cover no-repeat fixed;
  display:flex;flex-direction:column;
  transition:background .4s ease;
  overflow-x:hidden;
}

/* ── OVERLAY de contraste sobre o fundo ── */
body::before{
  content:'';position:fixed;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,.5) 100%);
  z-index:0;transition:opacity .4s;
}
body.tema-claro::before{background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.35) 100%)}

/* ════════════════════════════════════════
   LOGIN
════════════════════════════════════════ */
#loginWrap{
  position:relative;z-index:10;
  display:none;flex-direction:column;align-items:center;
  justify-content:center;min-height:100vh;padding:24px;
}
.login-card{
  background:var(--glass-dark);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid var(--border-dark);
  border-radius:24px;padding:36px 32px;
  width:100%;max-width:360px;text-align:center;
  color:var(--text-dark);
}
body.tema-claro .login-card{
  background:var(--glass-light);border-color:var(--border-light);color:var(--text-light);
}
.login-card h2{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:6px;font-weight:400}
.login-card p{font-size:13px;opacity:.65;margin-bottom:24px}
.login-card input{
  width:100%;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);border-radius:12px;
  color:#fff;padding:11px 14px;font-size:14px;outline:none;
  font-family:'DM Sans',sans-serif;margin-bottom:10px;
  transition:border-color .2s;
}
body.tema-claro .login-card input{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.15);color:#0f172a}
body.tema-claro .login-card input::placeholder{color:rgba(15,23,42,.4)}
.login-card input::placeholder{color:rgba(255,255,255,.4)}
.login-card input:focus{border-color:rgba(255,255,255,.5)}
body.tema-claro .login-card input:focus{border-color:rgba(15,23,42,.4)}
.btn-login{
  width:100%;padding:12px;border:none;border-radius:12px;
  background:#2563EB;color:#fff;font-size:14px;font-weight:600;
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:background .2s,transform .1s;margin-top:4px;
}
.btn-login:hover{background:#1D4ED8}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
#loginErro{color:#FCA5A5;font-size:13px;margin-top:8px;min-height:18px}

/* ════════════════════════════════════════
   CONTAINER PRINCIPAL
════════════════════════════════════════ */
#app{
  position:relative;z-index:10;
  display:none;flex-direction:column;
  min-height:100vh;padding:0 0 40px;
}

/* ── Header com logo e nome do projeto ── */
.app-header{
  padding:40px 24px 0;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
}
.logo-wrap{margin-bottom:16px}
.logo-wrap img{
  max-width:160px;max-height:64px;
  object-fit:contain;
  filter:drop-shadow(0 2px 12px rgba(0,0,0,.3));
  animation:fadeDown .5s ease both;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

.proj-nome{
  font-family:'DM Serif Display',serif;
  font-size:clamp(22px,5vw,32px);font-weight:400;
  color:var(--text-dark);letter-spacing:-.01em;
  animation:fadeDown .5s .1s ease both;
}
body.tema-claro .proj-nome{color:var(--text-light)}

.proj-desc{
  font-size:14px;color:var(--muted-dark);
  margin-top:6px;max-width:340px;line-height:1.5;
  animation:fadeDown .5s .15s ease both;
}
body.tema-claro .proj-desc{color:var(--muted-light)}

/* ── Divisor ── */
.divider{
  width:40px;height:2px;
  background:rgba(255,255,255,.25);
  border-radius:2px;margin:20px auto;
  animation:fadeDown .5s .2s ease both;
}
body.tema-claro .divider{background:rgba(15,23,42,.15)}

/* ════════════════════════════════════════
   LISTA DE ARQUIVOS
════════════════════════════════════════ */
.files-wrap{
  padding:0 20px;
  width:100%;max-width:480px;
  margin:0 auto;
}

/* Loading skeleton */
.sk-item{
  height:58px;border-radius:16px;margin-bottom:10px;
  background:linear-gradient(90deg,rgba(255,255,255,.06) 25%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.06) 75%);
  background-size:200% 100%;
  animation:sk 1.4s infinite,fadeUp .4s ease both;
}
body.tema-claro .sk-item{
  background:linear-gradient(90deg,rgba(0,0,0,.04) 25%,rgba(0,0,0,.08) 50%,rgba(0,0,0,.04) 75%);
  background-size:200% 100%;
}
@keyframes sk{to{background-position:-200% 0}}

/* Item de arquivo */
.file-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:var(--link-dark);
  border:1px solid var(--border-dark);
  border-radius:16px;
  color:var(--text-dark);
  text-decoration:none;
  margin-bottom:10px;
  cursor:pointer;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:background .2s,transform .15s,box-shadow .2s;
  animation:fadeUp .4s ease both;
}
.file-item:nth-child(1){animation-delay:.05s}
.file-item:nth-child(2){animation-delay:.1s}
.file-item:nth-child(3){animation-delay:.15s}
.file-item:nth-child(4){animation-delay:.2s}
.file-item:nth-child(5){animation-delay:.25s}
.file-item:nth-child(n+6){animation-delay:.3s}

body.tema-claro .file-item{
  background:var(--link-light);border-color:var(--border-light);color:var(--text-light);
}
.file-item:hover{
  background:var(--link-dark-h);
  transform:translateY(-1px);
  box-shadow:0 8px 24px rgba(0,0,0,.2);
}
body.tema-claro .file-item:hover{
  background:var(--link-light-h);
  box-shadow:0 4px 16px rgba(0,0,0,.1);
}
.file-item:active{transform:scale(.98);transition-duration:.08s}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Ícone do arquivo */
.fi-icon{
  width:40px;height:40px;flex-shrink:0;
  border-radius:10px;
  background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  transition:background .2s;
}
body.tema-claro .fi-icon{background:rgba(0,0,0,.08)}
.file-item:hover .fi-icon{background:rgba(255,255,255,.2)}
body.tema-claro .file-item:hover .fi-icon{background:rgba(0,0,0,.12)}

/* Nome e seta */
.fi-name{flex:1;font-size:14px;font-weight:500;line-height:1.3}
.fi-arrow{
  font-size:12px;opacity:.45;flex-shrink:0;
  transition:opacity .2s,transform .2s;
}
.file-item:hover .fi-arrow{opacity:.8;transform:translateX(3px)}

/* Estado vazio */
.empty-msg{
  text-align:center;padding:40px 20px;
  color:var(--muted-dark);font-size:14px;
  animation:fadeUp .4s ease both;
}
body.tema-claro .empty-msg{color:var(--muted-light)}
.empty-msg i{display:block;font-size:32px;margin-bottom:12px;opacity:.35}

/* ════════════════════════════════════════
   VIEWER INLINE (expande o item)
════════════════════════════════════════ */
.file-viewer{
  background:rgba(0,0,0,.6);
  border-radius:16px;margin-bottom:10px;overflow:hidden;
  display:none;flex-direction:column;
  border:1px solid rgba(255,255,255,.1);
}
.file-viewer.open{display:flex;animation:fadeUp .3s ease both}
.viewer-bar{
  padding:10px 14px;display:flex;align-items:center;
  justify-content:space-between;gap:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
body.tema-claro .viewer-bar{border-color:rgba(0,0,0,.08)}
.viewer-bar span{font-size:13px;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
body.tema-claro .viewer-bar span{color:rgba(15,23,42,.6)}
.v-btn{
  background:rgba(255,255,255,.1);border:none;border-radius:8px;
  color:#fff;font-size:12px;padding:5px 10px;cursor:pointer;
  font-family:'DM Sans',sans-serif;white-space:nowrap;
  transition:background .15s;display:flex;align-items:center;gap:5px;
}
.v-btn:hover{background:rgba(255,255,255,.2)}
body.tema-claro .v-btn{background:rgba(0,0,0,.08);color:#0f172a}
body.tema-claro .v-btn:hover{background:rgba(0,0,0,.15)}
.viewer-frame{border:none;width:100%;height:360px;display:block}
@media(min-width:480px){.viewer-frame{height:480px}}

/* ════════════════════════════════════════
   FOOTER
════════════════════════════════════════ */
.app-footer{
  text-align:center;padding:24px 20px 0;
  font-size:11px;color:rgba(255,255,255,.28);
  letter-spacing:.04em;text-transform:uppercase;
}
body.tema-claro .app-footer{color:rgba(15,23,42,.3)}

/* ════════════════════════════════════════
   SPINNER
════════════════════════════════════════ */
.spin-wrap{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
.spin-ring{
  width:36px;height:36px;
  border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;
  animation:rot .7s linear infinite;
}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Spinner inicial enquanto carrega -->
<div class="spin-wrap" id="spinner">
  <div class="spin-ring"></div>
</div>

<!-- Tela de login (quando acesso_tag = senha) -->
<div id="loginWrap">
  <div class="login-card">
    <img id="loginLogo" src="" alt="" style="max-height:48px;max-width:140px;object-fit:contain;margin-bottom:18px;display:none">
    <h2>Área restrita</h2>
    <p>Faça login para acessar os documentos</p>
    <input id="inpUser" type="text" placeholder="Usuário" autocomplete="username">
    <input id="inpPass" type="password" placeholder="Senha" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')fazerLogin()">
    <button class="btn-login" id="btnLogin" onclick="fazerLogin()">
      <span id="lblLogin">Entrar</span>
    </button>
    <div id="loginErro"></div>
  </div>
</div>

<!-- App principal -->
<div id="app">
  <div class="app-header">
    <div class="logo-wrap">
      <img id="appLogo" src="" alt="" style="display:none">
    </div>
    <h1 class="proj-nome" id="appNome"></h1>
    <p class="proj-desc" id="appDesc"></p>
    <div class="divider"></div>
  </div>

  <div class="files-wrap" id="filesWrap">
    <!-- Skeletons -->
    <div class="sk-item"></div>
    <div class="sk-item" style="animation-delay:.08s"></div>
    <div class="sk-item" style="animation-delay:.16s"></div>
  </div>

  <div class="app-footer">NexTag</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycby-goyk5onX2MtZEqoF1ggIRGmuN7yqN1guhltp8gKyJxBCmcf3sg7M5PMWHCr3SqPbNw/exec";

// ── Estado ──
let temaAtivo="escuro";
let viewerAberto=null; // referência ao viewer aberto

// ── Pega o id do projeto na URL ──
function getProjId(){return new URLSearchParams(location.search).get("id")||new URLSearchParams(location.search).get("projeto")}

// ── API JSONP ──
function api(p,cb,er){
  const s=document.createElement("script");
  const n="cb_"+Date.now()+"_"+(Math.random()*9999|0);
  const t=setTimeout(()=>{delete window[n];s.remove();if(er)er("Tempo esgotado.")},12000);
  window[n]=r=>{clearTimeout(t);delete window[n];s.remove();cb(r)};
  s.src=API+"?"+new URLSearchParams(p)+"&callback="+n;
  document.body.appendChild(s);
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

// ── Aplica tema claro/escuro ──
function aplicarTema(tema){
  temaAtivo=tema;
  if(tema==="claro") document.body.classList.add("tema-claro");
  else document.body.classList.remove("tema-claro");
}

// ── Login ──
function fazerLogin(){
  const user=document.getElementById("inpUser").value.trim();
  const pass=document.getElementById("inpPass").value;
  const btn=document.getElementById("btnLogin");
  const lbl=document.getElementById("lblLogin");
  const err=document.getElementById("loginErro");
  err.textContent="";
  if(!user||!pass){err.textContent="Preencha usuário e senha.";return}
  btn.disabled=true;lbl.textContent="Entrando…";
  api({action:"login",usuario:user,senha:pass,tipo:"tag"},res=>{
    btn.disabled=false;lbl.textContent="Entrar";
    if(res.ok){
      const id=getProjId();
      if(!res.projetos.includes(id)){err.textContent="Sem acesso a este projeto.";return}
      localStorage.setItem("user_tag",JSON.stringify({usuario:res.usuario,token:res.token,projetos:res.projetos}));
      document.getElementById("loginWrap").style.display="none";
      document.getElementById("app").style.display="flex";
      carregarApp();
    }else{err.textContent=res.erro||"Login inválido"}
  },m=>{btn.disabled=false;lbl.textContent="Entrar";err.textContent=m});
}

// ── Carrega projeto e arquivos ──
function carregarApp(){
  const id=getProjId();

  // Projeto: visual e textos
  api({action:"getProjeto",id_projeto:id},d=>{
    if(!d.projeto)return;
    const p=d.projeto;

    document.getElementById("appNome").textContent=p.nome||"";
    document.getElementById("appDesc").textContent=p.descricao||"";

    if(p.background) document.body.style.backgroundImage=`url('${p.background}')`;

    if(p.logo){
      const img=document.getElementById("appLogo");
      img.src=p.logo;img.style.display="block";
      // logo no card de login também
      const ll=document.getElementById("loginLogo");
      ll.src=p.logo;ll.style.display="block";
    }

    // Aplica tema antes dos arquivos (container) e depois dos arquivos (links)
    aplicarTema(p.glass_effect==="claro"?"claro":"escuro");
    document.title=p.nome?" NexTag — "+p.nome:"NexTag";
  });

  // Arquivos
  api({action:"getArquivos",projeto:id},d=>{
    const arqs=d.arquivos||[];
    const wrap=document.getElementById("filesWrap");
    wrap.innerHTML="";

    if(!arqs.length){
      wrap.innerHTML=`<div class="empty-msg"><i class="fas fa-folder-open"></i>Nenhum documento disponível.</div>`;
      return;
    }

    arqs.forEach((a,i)=>{
      // Container do item + viewer (ficam agrupados)
      const group=document.createElement("div");
      group.style.cssText="margin-bottom:10px";

      // Link / item clicável
      const item=document.createElement("div");
      item.className="file-item";
      item.style.marginBottom="0";
      item.innerHTML=`
        <div class="fi-icon"><i class="${esc(a.icone||"fas fa-file")}"></i></div>
        <span class="fi-name">${esc(a.nome)}</span>
        <i class="fas fa-chevron-right fi-arrow" id="arr_${i}"></i>`;

      // Viewer inline que expande abaixo do item
      const viewer=document.createElement("div");
      viewer.className="file-viewer";
      viewer.id="vw_"+i;
      viewer.innerHTML=`
        <div class="viewer-bar">
          <span>${esc(a.nome)}</span>
          <div style="display:flex;gap:6px">
            <a href="${esc(a.link)}" target="_blank" rel="noopener">
              <button class="v-btn"><i class="fas fa-download"></i> Baixar</button>
            </a>
            <button class="v-btn" onclick="fecharViewer(${i})">
              <i class="fas fa-xmark"></i> Fechar
            </button>
          </div>
        </div>
        <iframe class="viewer-frame" src="" data-src="${esc(a.link)}" loading="lazy" allow="autoplay"></iframe>`;

      item.addEventListener("click",()=>toggleViewer(i,a.link));
      group.appendChild(item);
      group.appendChild(viewer);
      wrap.appendChild(group);
    });

    // Reaplica tema nos itens criados
    aplicarTema(temaAtivo);
  });
}

// ── Abre/fecha viewer inline ──
function toggleViewer(idx,link){
  const vw=document.getElementById("vw_"+idx);
  const arr=document.getElementById("arr_"+idx);

  if(vw.classList.contains("open")){
    fecharViewer(idx);return;
  }

  // Fecha o anterior se houver
  if(viewerAberto!==null && viewerAberto!==idx){
    fecharViewer(viewerAberto);
  }

  // Carrega o iframe só quando abrir (lazy)
  const frame=vw.querySelector("iframe");
  if(!frame.src||frame.src==="about:blank"){
    frame.src=frame.dataset.src;
  }

  vw.classList.add("open");
  if(arr){arr.style.transform="rotate(90deg)";arr.style.opacity=".8"}
  viewerAberto=idx;

  // Scroll suave para o item
  setTimeout(()=>vw.scrollIntoView({behavior:"smooth",block:"nearest"}),100);
}

function fecharViewer(idx){
  const vw=document.getElementById("vw_"+idx);
  const arr=document.getElementById("arr_"+idx);
  if(vw){vw.classList.remove("open")}
  if(arr){arr.style.transform="";arr.style.opacity=""}
  if(viewerAberto===idx) viewerAberto=null;
}

// ════════════════════════════════════
//  INICIALIZAÇÃO
// ════════════════════════════════════
window.onload=()=>{
  const id=getProjId();
  const spinner=document.getElementById("spinner");

  if(!id){
    spinner.innerHTML=`<p style="color:#fff;font-size:14px;text-align:center;padding:20px">Projeto não encontrado na URL.</p>`;
    return;
  }

  // Carrega visual do projeto primeiro (para aplicar fundo o mais cedo possível)
  api({action:"getVisualProjeto",projeto:id},res=>{
    if(res.ok){
      if(res.background) document.body.style.backgroundImage=`url('${res.background}')`;
      aplicarTema(res.glass_effect==="claro"?"claro":"escuro");
    }
  });

  // Verifica se precisa de login
  api({action:"getAcessoTag",projeto:id},res=>{
    spinner.style.display="none";

    if(res.acesso_tag==="livre"){
      document.getElementById("app").style.display="flex";
      carregarApp();
    }else{
      // Tenta sessão salva
      const saved=localStorage.getItem("user_tag");
      if(saved){
        const u=JSON.parse(saved);
        if(u?.projetos?.includes(id)){
          document.getElementById("app").style.display="flex";
          carregarApp();return;
        }
      }
      document.getElementById("loginWrap").style.display="flex";
    }
  },()=>{
    spinner.style.display="none";
    document.getElementById("loginWrap").style.display="flex";
  });
};
</script>
</body>
</html>
