<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwJzJYMMr9DDc7yqNvq-jXz9pNy1o0WcbgVfto_fgy5YppuEPHmclXxKuquexU0YeE4sA/exec";

/* JSONP */
function chamarAPI(params, callback){
  const cb = "cb_" + Date.now();
  const script = document.createElement("script");

  window[cb] = function(data){
    callback(data);
    delete window[cb];
    script.remove();
  };

  script.src = API_URL + "?" + new URLSearchParams(params) + "&callback=" + cb + "&nocache=" + Date.now();

  script.onerror = () => {
    console.error("Erro na API");
    delete window[cb];
    script.remove();
  };

  document.body.appendChild(script);
}

/* pega ID */
function getProjeto(){
  const url = new URLSearchParams(window.location.search);
  return url.get("id");
}

/* 🔐 LOGIN */
function fazerLogin(){

  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  chamarAPI({
    action:"login",
    usuario,
    senha,
    tipo:"tag"
  }, function(res){

    if(res.ok){
      localStorage.setItem("user", JSON.stringify(res));
      iniciarSistema();
    }else{
      document.getElementById("erro").innerText = res.erro || "Login inválido";
    }

  });
}

/* 🚀 INICIAR */
function iniciarSistema(){

  const user = JSON.parse(localStorage.getItem("user"));
  const projeto = getProjeto();

  if(!user) return;

  if(!user.projetos.includes(projeto)){
    alert("Você não tem acesso a este projeto");
    return;
  }

  document.getElementById("loginBox").style.display = "none";
  document.querySelector(".container").style.display = "block";

  carregar();
}

/* 🔹 CARREGAR DADOS */
function carregar(){

  const projeto = getProjeto();

  if(!projeto){
    alert("Projeto não informado na URL");
    return;
  }

  // 🔥 RESET VISUAL
  document.getElementById("lista").innerHTML = "";
  document.getElementById("logo").src = "";
  document.getElementById("nome").innerText = "";
  document.getElementById("descricao").innerText = "";
  document.body.style.backgroundImage = "";

  /* 🔹 PROJETO */
  chamarAPI({
    action:"getProjeto",
    id_projeto: projeto
  }, function(data){

    if(!data.projeto) return;

    const p = data.projeto;

    document.getElementById("nome").innerText = p.nome || "";
    document.getElementById("descricao").innerText = p.descricao || "";
  });

  /* 🔹 VISUAL (USUÁRIO) */
  chamarAPI({
    action:"getVisualProjeto",
    projeto: projeto
  }, function(data){

    if(!data.ok) return;

    if(data.background){
      document.body.style.backgroundImage = `url('${data.background}')`;
    }

    if(data.logo){
      document.getElementById("logo").src = data.logo;
    }
  });

  /* 🔹 ARQUIVOS */
  chamarAPI({
    action:"getArquivos",
    projeto
  }, function(data){

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    (data.arquivos || []).forEach(a => {

      const div = document.createElement("a");

      div.href = a.link;
      div.target = "_blank";

      div.innerHTML = `
        <i class="${a.icone || 'fas fa-file'}"></i>
        ${a.nome}
      `;

      lista.appendChild(div);
    });

  });
}

/* 🔄 INIT */
window.onload = function(){

  document.querySelector(".container").style.display = "none";

  const user = localStorage.getItem("user");

  if(user){
    iniciarSistema();
  }
};
</script>
